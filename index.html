<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le'Kiray | Unified Heavy Marketplace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
  <link rel="stylesheet" href="/src/styles/globals.css">
</head>

<body class="selection:bg-indigo-500/30">
  <div id="error-overlay"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); color:red; z-index:9999; padding:20px; font-family:monospace; white-space:pre-wrap; overflow:auto;">
    <h1 style="color:white">Runtime Error Detected</h1>
    <pre id="error-message"></pre>
  </div>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      // Ignore errors that don't originate from our application (e.g., browser extensions)
      const isInternal = !url || 
                        url.includes(window.location.host) || 
                        url.startsWith('/') || 
                        url.includes('src/') ||
                        url.includes('vite');
      
      if (!isInternal) {
        console.warn('Suppressed third-party error:', msg, 'at', url);
        return false;
      }

      var overlay = document.getElementById('error-overlay');
      var message = document.getElementById('error-message');
      overlay.style.display = 'block';
      message.textContent = 'Error: ' + msg + '\nFile: ' + url + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\n\n' + (error ? error.stack : '');
      return false;
    };
    
    window.onunhandledrejection = function (event) {
      // Ignore rejections without a reason or from third-party sources
      if (!event.reason || (event.reason.stack && !event.reason.stack.includes(window.location.host))) {
         console.warn('Suppressed third-party promise rejection:', event.reason);
         return;
      }

      var overlay = document.getElementById('error-overlay');
      var message = document.getElementById('error-message');
      overlay.style.display = 'block';
      message.textContent = 'Unhandled Rejection: ' + event.reason;
    };
  </script>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
